    (function () {
      var appVersion = 'v16';
      var installPromptAvailable = false;
      var isInstalled = false;
      window.__FLAG_DRAW_VERSION = appVersion;

      function inStandaloneMode() {
        return !!(
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone
        );
      }

      function ensureHeadTag(selector, createTag) {
        if (!document.head || document.head.querySelector(selector)) return;
        document.head.appendChild(createTag());
      }

      function ensurePwaHead() {
        ensureHeadTag('link[rel="manifest"]', function () {
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/manifest.json';
          return link;
        });
        ensureHeadTag('meta[name="theme-color"]', function () {
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = '#ec3013';
          return meta;
        });
        ensureHeadTag('link[rel="apple-touch-icon"]', function () {
          var link = document.createElement('link');
          link.rel = 'apple-touch-icon';
          link.href = '/icon-192.png';
          return link;
        });
        ensureHeadTag('link[rel="icon"]', function () {
          var link = document.createElement('link');
          link.rel = 'icon';
          link.href = '/icon-192.png';
          return link;
        });
      }

      function recoverStuckLoader() {
        var recoveryParam = '__fd_recover';
        var url;
        try {
          url = new URL(window.location.href);
          if (url.searchParams.get(recoveryParam) === appVersion) return;
          url.searchParams.set(recoveryParam, appVersion);
        } catch (error) {
          url = null;
        }

        var tasks = [];
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            })
          );
        }
        if (window.caches && caches.keys) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.filter(function (key) {
                return /^flag-draw-/.test(key);
              }).map(function (key) {
                return caches.delete(key);
              }));
            })
          );
        }

        Promise.all(tasks).catch(function (error) {
          console.warn('[pwa] loading recovery failed', error);
        }).then(function () {
          if (url) {
            window.location.replace(url.href);
          } else {
            window.location.reload();
          }
        });
      }

      function purgeOldAppCaches() {
        var currentCache = 'flag-draw-' + appVersion;
        if (!window.caches || !caches.keys) return;
        caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (key) {
            return /^flag-draw-/.test(key) && key !== currentCache;
          }).map(function (key) {
            return caches.delete(key);
          }));
        }).catch(function (error) {
          console.warn('[pwa] cache cleanup failed', error);
        });
      }

      function registerServiceWorker() {
        if (!('serviceWorker' in navigator) || window.__flagDrawSwRegistered) return;
        window.__flagDrawSwRegistered = true;
        if (!window.__flagDrawControllerRefreshBound) {
          window.__flagDrawControllerRefreshBound = true;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (window.__flagDrawControllerRefreshing) return;
            if (!document.getElementById('__bundler_loading')) return;
            window.__flagDrawControllerRefreshing = true;
            window.location.reload();
          });
        }
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then(function (registration) {
            function activateWaiting(worker) {
              if (worker && worker.postMessage) {
                worker.postMessage({ type: 'SKIP_WAITING' });
              }
            }
            if (registration.waiting) activateWaiting(registration.waiting);
            registration.addEventListener('updatefound', function () {
              var worker = registration.installing;
              if (!worker) return;
              worker.addEventListener('statechange', function () {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  activateWaiting(worker);
                }
              });
            });
            if (registration && registration.update) registration.update();
          })
          .catch(function (error) {
            console.warn('[pwa] service worker registration failed', error);
          });

      function hideInstallButton() {
        var btn = document.getElementById('__pwa_install_btn');
        if (btn) btn.remove();

        var help = document.getElementById('__pwa_install_help');

        }
        label.textContent = appVersion;
      }

      function updateInstallButton() {
        var btn = document.getElementById('__pwa_install_btn');
        if (!btn) return;
        if (isInstalled || inStandaloneMode()) {
          hideInstallButton();
          return;

      window.__flagDrawMountInstallButton = function () {
        ensurePwaHead();
        registerServiceWorker();
        mountVersionLabel();
        if (!document.body || isInstalled || inStandaloneMode()) {
          hideInstallButton();
          return;
        }
        if (!document.getElementById('__pwa_install_btn')) {
          var btn = document.createElement('button');
          btn.id = '__pwa_install_btn';
          btn.type = 'button';
          btn.textContent = 'INSTALL APP';
          btn.setAttribute('aria-label', 'Install Flag Draw app');
          btn.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:2147483647;min-width:132px;padding:14px 18px;border:2px solid #201e1d;border-radius:0;background:#ec3013;color:#fff;font:800 15px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 #201e1d;display:block;touch-action:manipulation';

            registerServiceWorker();
            if (navigator.serviceWorker && navigator.serviceWorker.ready) {
              navigator.serviceWorker.ready.then(updateInstallButton).catch(function () {});
            }
            showInstallHelp('To install without freezing, tap the Chrome menu (three dots), then Install app or Add to Home screen. If an old Flag Draw app is installed, remove it first and install again from this page.');
          });
          document.body.appendChild(btn);
        }
        updateInstallButton();
      };

      window.__flagDrawScheduleInstallButton = function () {
        function mount() {
          try {
            window.__flagDrawMountInstallButton();
          } catch (error) {
            console.warn('[pwa] install button mount failed', error);
          }
        }

        var raf = window.requestAnimationFrame || function (cb) { return setTimeout(cb, 16); };
        raf(function () { raf(mount); });
        setTimeout(mount, 250);
        setTimeout(mount, 1000);
        setTimeout(mount, 2500);

        if (!window.__flagDrawInstallKeepAlive) {
          window.__flagDrawInstallKeepAlive = setInterval(mount, 2000);
        }
        if (!window.__flagDrawInstallObserver && window.MutationObserver) {
          window.__flagDrawInstallObserver = new MutationObserver(function () {
            if (!document.getElementById('__pwa_install_btn') || !document.getElementById('__flag_draw_version')) mount();
          });
          window.__flagDrawInstallObserver.observe(document.documentElement, {
            childList: true,
            subtree: true
          });
        }
      };

      window.addEventListener('beforeinstallprompt', function (event) {
        installPromptAvailable = true;
        window.__pwaInstallPrompt = null;
        hideInstallHelp();
        window.dispatchEvent(new CustomEvent('pwa-install-available'));

      });

      window.addEventListener('appinstalled', function () {
        installPromptAvailable = false;
        window.__pwaInstallPrompt = null;
        isInstalled = true;
        hideInstallButton();
        hideInstallHelp();
      });

      purgeOldAppCaches();
      registerServiceWorker();
      document.addEventListener('DOMContentLoaded', registerServiceWorker, { once: true });
      window.addEventListener('load', registerServiceWorker, { once: true });
      window.addEventListener('pwa-install-available', updateInstallButton);
      window.__flagDrawRecoverLoading = recoverStuckLoader;
    })();

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')

    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (

    // local text and treats a miss as authoritative — never relaying to

    const blobUrls = {};
    const resourceBlobs = {};

      // where origin strings can't discriminate — a sandboxed root's

    // asking the direct parent over the relay protocol above. An

    // degraded state as a refused embed.
    {

      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,

    }

    console.error('Bundle unpack error:', err);

gap:14px\">\n          <div>\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#9b9797;margin-bottom:8px\">Deck<\u002Fdiv>\n            <div style=\"display:flex;gap:0\">\n              <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#9b9797;margin-bottom:8px\">Mode<\u002Fdiv>\n            <div style=\"display:flex\">\n              <sc-for list=\"{{ modeButtons }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ m.pick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#9b9797;margin-bottom:8px\">Chalk<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <sc-for list=\"{{ swatches }}\" as=\"sw\" hint-placeholder-count=\"7\">\n                <button sc-camel-on-click=\"{{ sw.pick }}\" title=\"{{ sw.name }}\" style=\"{{ sw.style }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n              <input type=\"color\" value=\"{{ customColorValue }}\" sc-camel-on-input=\"{{ onCustomColor }}\" style=\"{{ customColorStyle }}\" title=\"Pick any color\" \u002F>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#9b9797;margin-bottom:8px\">Brush<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ sizes }}\" as=\"sz\" own, onMove: this.onMove, onUp: this.onUp, toggleHint: this.toggleHint,\n      hostCanvasRef: this.hostCanvasRef, onHostDown: this.onHostDown, onHostMove: this.onHostMove, onHostUp: this.onHostUp, clearHostCanvas: this.clearHostCanvas,\n\n      ytApiKeyValue: s.ytApiKey, onYtApiKey: this.setYtApiKey,\n      ytChannelIdValue: s.ytChannelId, onYtChannelId: this.setYtChannelId,\n      chatConnectLabel: s.chatOn ? \"Disconnect\" : (s.chatStatus === \"connecting\" ? \"Connecting\u2026\" : \"Connect\"),\n      chatConnectAction: s.chatOn ? this.disconnectChat : this.connectChat,\n      chatConnectStyle: {\n        height: 40, padding: \"0 16px\", border: \"2px solid #201e1d\",\n        background: s.chatOn ? \"transparent\" : \"#201e1d\",\n        color: s.chatOn ? \"#201e1d\" : \"#f3f2f2\",\n        fontFamily: \"inherit\", fontSize: 13, fontWeight: 700, textTransform: \"uppercase\",\n        letterSpacing: \"0.06em\", cursor: \"pointer\", flexShrink: 0,\n      },\n      chatStatusDotStyle: {\n        width: 10, height: 10, borderRadius: \"50%\", flexShrink: 0,\n        background: s.chatStatus === \"live\" ? \"#2FBF71\" : s.chatStatus === \"connecting\" ? \"#F5C542\" : s.chatStatus === \"error\" ? \"#ec3013\" : \"#bab6b6\",\n      },\n      chatStatusText: s.chatStatus === \"live\" ? \"Live \u2014 reading chat\" : s.chatStatus === \"connecting\" ? \"Connecting\u2026\" : s.chatStatus === \"error\" ? \"Error\" : \"Not connected\",\n      hasChatError: s.chatStatus === \"error\" && !!s.chatError,\n      chatErrorText: s.chatError,\n\n      leaderboardRows: (() => {\n        const entries = Object.entries(s.leaderboard).sort((a, b) => b[1] - a[1]).slice(0, 5);\n        const medals = [\"\ud83e\udd47\", \"\ud83e\udd48\", \"\ud83e\udd49\"];\n        return entries.map(([name, score], i) => ({\n          rank: medals[i] || `${i + 1}.`, name, score,\n          rowStyle: { display: \"flex\", alignItems: \"center\", gap: 10, padding: \"4px 0\" },\n          rankStyle: { width: 26
