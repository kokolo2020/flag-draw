        var recoveryParam = '__fd_recover';
        var url;
        try {
          url = new URL(window.location.href);
          if (url.searchParams.get(recoveryParam) === appVersion) return;
          url.searchParams.set(recoveryParam, appVersion);
        } catch (error) {
          url = null;
        }

        var tasks = [];
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            })
          );
        }
        if (window.caches && caches.keys) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.filter(function (key) {
                return /^flag-draw-/.test(key);
              }).map(function (key) {
                return caches.delete(key);
              }));
            })
          );

          console.warn('[pwa] loading recovery failed', error);

      window.__flagDrawScheduleInstallButton = function () {
        function mount() {
          try {
            window.__flagDrawMountInstallButton();

            console.warn('[pwa] install button mount failed', error);

        setTimeout(mount, 1000);
        setTimeout(mount, 2500);

      document.addEventListener('DOMContentLoaded', registerServiceWorker, { once: true });
      window.addEventListener('load', registerServiceWorker, { once: true });

: cx + \"%\", top: \"50%\", width: size + \"%\", aspectRatio: \"1\", border: \"5px solid \" + col, borderRadius: \"50%\", transform: \"translate(-50%,-50%)\" });\nconst STAR = \"polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)\";\nconst star = (bg, cx, cy, size) => L({ left: cx + \"%\", top: cy + \"%\", width: size + \"%\", aspectRatio: \"1\", background: bg, clipPath: STAR, transform: \"translate(-50%,-50%)\" });\nconst nordic = (bg, cross) => [full(bg), vband(cross, 30, 12), band(cross, 42, 16)];\nconst tri = (bg, path) => L({ inset: 0, background: bg, clipPath: path });\n\nconst WORLD_FLAGS = [\n  [\"Afghanistan\",\"af\"],[\"Albania\",\"al\"],[\"Algeria\",\"dz\"],[\"Andorra\",\"ad\"],[\"Angola\",\"ao\"],\n  [\"Antigua and Barbuda\",\"ag\"],[\"Argentina\",\"ar\"],[\"Armenia\",\"am\"],[\"Australia\",\"au\"],[\"Austria\",\"at\"],\n  [\"Azerbaijan\",\"az\"],[\"Bahamas\",\"bs\"],[\"Bahrain\",\"bh\"],[\"Bangladesh\",\"bd\"],[\"Barbados\",\"bb\"],\n  [\"Belarus\",\"by\"],[\"Belgium\",\"be\"],[\"Belize\",\"bz\"],[\"Benin\",\"bj\"],[\"Bhutan\",\"bt\"],\n  [\"Bolivia\",\"bo\"],[\"Bosnia and Herzegovina\",\"ba\"],[\"Botswana\",\"bw\"],[\"Brazil\",\"br\"],[\"Brunei\",\"bn\"],\n  [\"Bulgaria\",\"bg\"],[\"Burkina Faso\",\"bf\"],[\"Burundi\",\"bi\"],[\"Cambodia\",\"kh\"],[\"Cameroon\",\"cm\"],\n  [\"Canada\",\"ca\"],[\"Cape Verde\",\"cv\"],[\"Central African Republic\",\"cf\"],[\"Chad\",\"td\"],[\"Chile\",\"cl\"],\n  [\"China\",\"cn\"],[\"Colombia\",\"co\"],[\"Comoros\",\"km\"],[\"Congo\",\"cg\"],[\"DR Congo\",\"cd\"],\n  [\"Costa Rica\",\"cr\"],[\"Croatia\",\"hr\"],[\"Cuba\",\"cu\"],[\"Cyprus\",\"cy\"],[\"Czechia\",\"cz\"],\n  [\"Denmark\",\"dk\"],[\"Djibouti\",\"dj\"],[\"Dominica\",\"dm\"],[\"Dominican Republic\",\"do\"],[\"Ecuador\",\"ec\"],\n  [\"Egypt\",\"eg\"],[\"El Salvador\",\"sv\"],[\"Equatorial Guinea\",\"gq\"],[\"Eritrea\",\"er\"],[\"Estonia\",\"ee\"],\n  [\"Eswatini\",\"sz\"],[\"Ethiopia\",\"et\"],[\"Fiji\",\"fj\"],[\"Finland\",  and the Grenadines\",\"vc\"],[\"Samoa\",\"ws\"],[\"San Marino\",\"sm\"],\n  [\"Sao Tome and Principe\",\"st\"],[\"Saudi Arabia\",\"sa\"],[\"Senegal\",\"sn\"],[\"Serbia\",\"rs\"],[\"Seychelles\",\"sc\"],\n  [\"Sierra Leone\",\"sl\"],[\"Singapore\",\"sg\"],[\"Slovakia\",\"sk\"],[\"Slovenia\",\"si\"],[\"Solomon Islands\",\"sb\"],\n  [\"Somalia\",\"so\"],[\"South Africa\",\"za\"],[\"South Korea\",\"kr\"],[\"South Sudan\",\"ss\"],[\"Spain\",\"es\"],\n  [\"Sri Lanka\",\"lk\"],[\"Sudan\",\"sd\"],[\"Suriname\",\"sr\"],[\"Sweden\",\"se\"],[\"Switzerland\",\"ch\",true],\n  [\"Syria\",\"sy\"],[\"Taiwan\",\"tw\"],[\"Tajikistan\",\"tj\"],[\"Tanzania\",\"tz\"],[\"Thailand\",\"th\"],\n  [\"Timor-Leste\",\"tl\"],[\"Togo\",\"tg\"],[\"Tonga\",\"to\"],[\"Trinidad and Tobago\",\"tt\"],[\"Tunisia\",\"tn\"],\n  [\"Turkiye\",\"tr\"],[\"Turkmenistan\",\"tm\"],[\"Tuvalu\",\"tv\"],[\"Uganda\",\"ug\"],[\"Ukraine\",\"ua\"],\n  [\"United Arab Emirates\",\"ae\"],[\"United Kingdom\",\"gb\"],[\"United States\",\"us\"],[\"Uruguay\",\"uy\"],[\"Uzbekistan\",\"uz\"],\n  [\"Vanuatu\",\"vu\"],[\"Vatican City\",\"va\",true],[\"Venezuela\",\"ve\"],[\"Vietnam\",\"vn\"],[\"Yemen\",\"ye\"],\n  [\"Zambia\",\"zm\"],[\"Zimbabwe\",\"zw\"],\n];\nconst FLAGS = WORLD_FLAGS.map(([name, cc, square]) => ({ name, cc, square: !!square }));\n\n\nconst SWATCHES = [\n  [\"Chalk white\", \"#f4f1e8\"], [\"Black\", \"#101010\"], [\"Red\", \"#E8412B\"], [\"Blue\", \"#2F6DE0\"], [\"Green\", \"#2FBF71\"],\n  [\"Yellow\", \"#F5C542\"], [\"Pink\", \"#EF7BA6\"], [\"Eraser\", \"ERASE\"],\n];\n\nconst FRUITS = [\"Pineapple\", \"Banana\", \"Watermelon\", \"Strawberry\", \"Avocado\", \"Cherry\", \"Grapes\", \"Lemon\", \"Coconut\", \"Kiwi\", \"Mango\", \"Pear\", \"Peach\", \"Blueberry\", \"Dragonfruit\", \"Fig\", \"Pomegranate\", \"Papaya\"];\nconst ANIMALS = [\"Elephant\", \"Penguin\", \"Giraffe\", \"Octopus\", \"Kangaroo\", \"Flamingo\", \"Hedgehog\", \"Crocodile\", \"Owl\", \"Snail\", \"Camel\", \"Shark\", \"Frog\", \"Bat\", \"Sloth ize: 13, color: \"#c9d6d0\", display: s.chatOn && !Object.keys(s.leaderboard).length ? \"block\" : \"none\" },\n      toastText: s.toast || \"\",\n      toastStyle: {\n        position: \"absolute\", top: 24, left: \"50%\",\n        transform: s.toast ? \"translate(-50%,0)\" : \"translate(-50%,-20px)\",\n        zIndex: 16, background: \"#ec3013\", color: \"#f3f2f2\", padding: \"10px 22px\", fontSize: 18, fontWeight: 800,\n        letterSpacing: \"0.04em\", opacity: s.toast ? 1 : 0,\n        transition: \"opacity 260ms ease, transform 260ms ease\", pointerEvents: \"none\",\n        boxShadow: \"0 8px 20px rgba(0,0,0,0.3)\",\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
